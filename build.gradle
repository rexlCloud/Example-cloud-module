plugins {
    id 'java'
}

group = 'de.rexlcloud.example'
version = '1.0.0'

// The rexlCloud version this example is built against; use the version of your cloud
def rexlCloudVersion = '1.0.1'

repositories {
    mavenCentral()
    // The rexlCloud APIs
    maven { url = 'https://repo.rexlcloud.de/releases' }
}

dependencies {
    // compileOnly: the master already contains the API and loads the module into it. It brings Gson (the
    // ModuleApi answers with JSON) and Adventure along.
    compileOnly "de.rexlcloud:module-api:$rexlCloudVersion"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('module.json') {
        expand(version: project.version)
    }
}
